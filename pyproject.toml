readme = "README.md"
authors = [
    { name = "Krishna0659", email = "gaur54827@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "langchain>=1.4.6",
    "langchain-anthropic>=1.7.6",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.12",
    "langchain-google-genai>=4.4.2",
    "langchain-openai>=1.7.2",
